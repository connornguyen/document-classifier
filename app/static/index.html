<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Classifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 36px;
      width: 100%;
      max-width: 620px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 14px;
      color: #555;
      transition: all 0.15s;
    }

    .tab.active {
      background: #111;
      color: white;
      border-color: #111;
    }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #444;
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      resize: vertical;
      outline: none;
      transition: border 0.15s;
    }

    textarea:focus { border-color: #111; }

    .file-drop {
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 36px;
      text-align: center;
      cursor: pointer;
      transition: border 0.15s;
      color: #888;
      font-size: 14px;
    }

    .file-drop:hover, .file-drop.dragover { border-color: #111; color: #111; }
    .file-drop input { display: none; }
    .file-name { margin-top: 8px; font-size: 13px; color: #555; }

    /* Threshold row */
    .threshold-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    .threshold-row label { margin: 0; white-space: nowrap; }

    input[type="range"] { flex: 1; cursor: pointer; }

    .threshold-val {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      width: 32px;
      text-align: right;
    }

    /* Button */
    button.submit {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.submit:hover { background: #333; }
    button.submit:disabled { background: #aaa; cursor: not-allowed; }

    /* Result */
    #result {
      margin-top: 24px;
      display: none;
    }

    .result-label {
      font-size: 28px;
      font-weight: 700;
      color: #111;
    }

    .result-label.unknown { color: #999; }

    .confidence {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
      margin-bottom: 16px;
    }

    .bars { display: flex; flex-direction: column; gap: 8px; }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .bar-name { width: 72px; color: #555; }

    .bar-track {
      flex: 1;
      height: 8px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #111;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .bar-fill.top { background: #111; }
    .bar-pct { width: 40px; text-align: right; color: #555; }

    .error-msg {
      margin-top: 16px;
      padding: 12px;
      background: #fff0f0;
      border: 1px solid #fcc;
      border-radius: 8px;
      color: #c00;
      font-size: 13px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <h1>Document Classifier</h1>
  <p class="subtitle">Classifies business documents into Invoice, Contract, Report, or Email</p>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('text')">Paste Text</button>
    <button class="tab" onclick="switchTab('file')">Upload File</button>
  </div>

  <!-- Text panel -->
  <div id="panel-text" class="panel active">
    <label for="textInput">Document text</label>
    <textarea id="textInput" placeholder="Paste your document text here..."></textarea>
  </div>

  <!-- File panel -->
  <div id="panel-file" class="panel">
    <div class="file-drop" id="fileDrop" onclick="document.getElementById('fileInput').click()">
      <div>📄 Click to upload or drag and drop</div>
      <div style="margin-top:6px; font-size:12px;">Supports .txt and .pdf</div>
      <input type="file" id="fileInput" accept=".txt,.pdf" onchange="handleFileSelect(this)" />
    </div>
    <div class="file-name" id="fileName"></div>
  </div>

  <!-- Threshold slider -->
  <div class="threshold-row">
    <label for="threshold">Confidence threshold</label>
    <input type="range" id="threshold" min="0.1" max="0.99" step="0.01" value="0.6"
           oninput="document.getElementById('threshVal').textContent = parseFloat(this.value).toFixed(2)" />
    <span class="threshold-val" id="threshVal">0.60</span>
  </div>

  <button class="submit" id="submitBtn" onclick="classify()">Classify</button>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Result -->
  <div id="result">
    <div class="result-label" id="resultLabel"></div>
    <div class="confidence" id="resultConfidence"></div>
    <div class="bars" id="resultBars"></div>
  </div>
</div>

<script>
  let activeTab = 'text'
  let selectedFile = null

  function switchTab(tab) {
    activeTab = tab
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', ['text','file'][i] === tab)
    })
    document.getElementById('panel-text').classList.toggle('active', tab === 'text')
    document.getElementById('panel-file').classList.toggle('active', tab === 'file')
    clearResult()
  }

  function handleFileSelect(input) {
    selectedFile = input.files[0]
    document.getElementById('fileName').textContent = selectedFile ? `Selected: ${selectedFile.name}` : ''
  }

  // Drag and drop support
  const drop = document.getElementById('fileDrop')
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover') })
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'))
  drop.addEventListener('drop', e => {
    e.preventDefault()
    drop.classList.remove('dragover')
    selectedFile = e.dataTransfer.files[0]
    document.getElementById('fileName').textContent = selectedFile ? `Selected: ${selectedFile.name}` : ''
  })

  function setLoading(on) {
    const btn = document.getElementById('submitBtn')
    btn.disabled = on
    btn.innerHTML = on ? '<span class="spinner"></span>Classifying...' : 'Classify'
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg')
    el.textContent = msg
    el.style.display = 'block'
  }

  function clearResult() {
    document.getElementById('result').style.display = 'none'
    document.getElementById('errorMsg').style.display = 'none'
  }

  async function classify() {
    clearResult()
    setLoading(true)

    const threshold = parseFloat(document.getElementById('threshold').value)

    try {
      let data

      if (activeTab === 'text') {
        // POST /classify with JSON body
        const text = document.getElementById('textInput').value.trim()
        if (!text) { showError('Please enter some text.'); setLoading(false); return }

        const res = await fetch('/classify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, threshold })
        })
        data = await res.json()
        if (!res.ok) { showError(data.detail || 'Something went wrong.'); setLoading(false); return }

      } else {
        // POST /upload with form data
        if (!selectedFile) { showError('Please select a file.'); setLoading(false); return }

        const form = new FormData()
        form.append('file', selectedFile)

        const res = await fetch('/upload', { method: 'POST', body: form })
        data = await res.json()
        if (!res.ok) { showError(data.detail || 'Something went wrong.'); setLoading(false); return }
      }

      showResult(data)

    } catch (err) {
      showError('Could not reach the API. Is the server running?')
    }

    setLoading(false)
  }

  function showResult(data) {
    const isUnknown = data.label === 'unknown'

    const labelEl = document.getElementById('resultLabel')
    labelEl.textContent = isUnknown ? 'Unknown' : data.label
    labelEl.className = 'result-label' + (isUnknown ? ' unknown' : '')

    document.getElementById('resultConfidence').textContent =
      isUnknown
        ? `Model confidence (${(data.confidence * 100).toFixed(1)}%) was below threshold (${(data.threshold * 100).toFixed(0)}%)`
        : `Confidence: ${(data.confidence * 100).toFixed(1)}%`

    const barsEl = document.getElementById('resultBars')
    barsEl.innerHTML = Object.entries(data.all_scores)
      .sort((a, b) => b[1] - a[1])   // sort highest first
      .map(([label, score]) => `
        <div class="bar-row">
          <div class="bar-name">${label}</div>
          <div class="bar-track">
            <div class="bar-fill ${label === data.label ? 'top' : ''}"
                 style="width: ${(score * 100).toFixed(1)}%"></div>
          </div>
          <div class="bar-pct">${(score * 100).toFixed(1)}%</div>
        </div>`)
      .join('')

    document.getElementById('result').style.display = 'block'
  }
</script>
</body>
</html>
